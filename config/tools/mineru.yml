tool:
  # CLI/config selector used by --tools mineru.
  name: "mineru"
  # Declared version recorded in attempt metadata.
  version: "mineru>=3.3,<4"
  # Conda environment used by analyze.
  environment: "digital-pdf-mineru"
  # Actual command template. {input_pdf} is required; {raw_dir} is the output folder.
  command:
    - "mineru"
    - "-p"
    - "{input_pdf}"
    - "-o"
    - "{raw_dir}"
    - "--backend"
    - "hybrid-engine"
    - "--effort"
    - "high"
    - "--method"
    - "auto"
  options:
    # Descriptive metadata mirroring command/setup; command controls runtime flags.
    backend: "hybrid-engine"
    effort: "high"
    method: "auto"
    windows_nvidia_runtime: "torch==2.8.0+cu126"
