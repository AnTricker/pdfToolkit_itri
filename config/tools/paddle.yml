tool:
  # CLI/config selector used by --tools paddle.
  name: "paddle"
  # Declared version recorded in attempt metadata; setup installs packages.
  version: "paddleocr>=3.3,<4; paddlepaddle==3.2.2"
  # Conda environment used by analyze.
  environment: "digital-pdf-paddle"
  # Actual command template. Placeholders: {analysis_pages_dir}, {raw_dir}, {input_pdf}.
  command:
    - "paddleocr"
    - "pp_structurev3"
    - "-i"
    - "{analysis_pages_dir}"
    - "--save_path"
    - "{raw_dir}"
    - "--use_doc_orientation_classify"
    - "False"
    - "--use_doc_unwarping"
    - "False"
  options:
    # Descriptive metadata only; these values do not become CLI flags.
    language_profile: "auto"
    layout_model: "PP-DocLayoutV3"
    structure_pipeline: "PP-StructureV3"
