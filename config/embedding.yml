embedding:
  mode: qwen3vl
  environment: digital-pdf-embedding
  command:
    - python
    - -m
    - digital_pdf_toolkit.embedding_worker
    - "{input}"
    - "{output_dir}"
    - --config-json
    - "{config_json}"
  modes:
    qwen3vl:
      provider: sentence_transformers
      model_id: Qwen/Qwen3-VL-Embedding-8B
      revision: null
      dimension: 4096
      runtime:
        device: cuda
        dtype: float16
        attention: sdpa
        batch_size: 1
        max_tokens: null
        normalize_embeddings: true

embedding_preprocess:
  text_when_nonempty: true
  image_when_text_empty: true
  persist_headings_across_pages: true
  aggregate_repeated_regions: true
  independent_text_types: [table, form]
